modLoader = "javafml"
loaderVersion = "[47,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/RambonL/mcmod-deathcounter/issues"

[[mods]]
modId = "deathcounter"
version = "${version}"
displayName = "DeathCounter"
authors = "RambonL."
logoFile = "assets/deathcounter/icon.png"
description = '''Server-side death counter with full history, coordinates and tab list display.'''
# Server only: a client without the mod gets no incompatibility warning in the server list.
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.deathcounter]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.deathcounter]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
ordering = "NONE"
side = "BOTH"
