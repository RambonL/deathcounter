// The mod itself lives in src/main/java and imports no loader at all. Each subproject compiles
// that same tree against its own loader and ships its own jar. See MULTILOADER.md.
//
// The root project builds nothing on its own — everything below is what the two loader projects
// have in common.
subprojects {
	apply plugin: 'java'
	apply plugin: 'maven-publish'

	// Otherwise both jars would be named after their subproject: fabric-1.0.1.jar.
	base.archivesName = "${rootProject.name}-${project.name}"

	sourceSets.main.java.srcDir rootProject.file("src/main/java")
	sourceSets.main.resources.srcDir rootProject.file("src/main/resources")

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	java {
		// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build"
		// task if it is present.
		// If you remove this line, sources will not be generated.
		withSourcesJar()

		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	jar {
		// LGPL-3.0 is the GPL plus additional permissions, so both texts have to ship.
		from(rootProject.files("LICENSE", "gpl-3.0.txt")) {
			rename { "${it}_${rootProject.name}" }
		}
	}

	// configure the maven publication
	publishing {
		publications {
			create("mavenJava", MavenPublication) {
				from components.java
			}
		}

		// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on
		// how to set up publishing.
		repositories {
			// Add repositories to publish to here.
		}
	}
}
