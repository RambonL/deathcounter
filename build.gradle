// The mod itself lives in src/main/java and imports no loader at all. Each subproject compiles
// that same tree against its own loader and ships its own jar. This branch is the Minecraft
// 1.20.1 port of main and has one loader project, Forge. See CLAUDE.md.
//
// The root project compiles nothing on its own — the subprojects block is what the loader
// projects have in common.
apply plugin: 'base'

subprojects {
	apply plugin: 'java'
	apply plugin: 'maven-publish'

	// Otherwise the jars would be named after their subproject: forge-1.2.0.jar.
	base.archivesName = "${rootProject.name}-${project.name}"

	sourceSets.main.java.srcDir rootProject.file("src/main/java")
	sourceSets.main.resources.srcDir rootProject.file("src/main/resources")

	java {
		// Minecraft 1.20.1 runs on Java 17. The toolchain also picks the JVM for the run tasks.
		toolchain.languageVersion = JavaLanguageVersion.of(17)
		withSourcesJar()
	}

	jar {
		// LGPL-3.0 is the GPL plus additional permissions, so both texts have to ship.
		from(rootProject.files("LICENSE", "gpl-3.0.txt")) {
			rename { "${it}_${rootProject.name}" }
		}
	}

	// configure the maven publication
	publishing {
		publications {
			create("mavenJava", MavenPublication) {
				from components.java
			}
		}

		// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on
		// how to set up publishing.
		repositories {
			// Add repositories to publish to here.
		}
	}
}
