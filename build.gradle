// The mod itself lives in src/main/java and imports no loader at all. Each subproject compiles
// that same tree against its own loader and ships its own jar. See MULTILOADER.md.
//
// The root project compiles nothing on its own — the subprojects block is what the loader
// projects have in common, and universalJar below zips their jars into one.
apply plugin: 'base'

subprojects {
	apply plugin: 'java'
	apply plugin: 'maven-publish'

	// Otherwise the jars would be named after their subproject: fabric-1.0.1.jar.
	base.archivesName = "${rootProject.name}-${project.name}"

	sourceSets.main.java.srcDir rootProject.file("src/main/java")
	sourceSets.main.resources.srcDir rootProject.file("src/main/resources")

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	java {
		// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build"
		// task if it is present.
		// If you remove this line, sources will not be generated.
		withSourcesJar()

		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	jar {
		// LGPL-3.0 is the GPL plus additional permissions, so both texts have to ship.
		from(rootProject.files("LICENSE", "gpl-3.0.txt")) {
			rename { "${it}_${rootProject.name}" }
		}
	}

	// configure the maven publication
	publishing {
		publications {
			create("mavenJava", MavenPublication) {
				from components.java
			}
		}

		// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on
		// how to set up publishing.
		repositories {
			// Add repositories to publish to here.
		}
	}
}

// One jar that runs on every loader. Nothing is remapped since 26.1, so the shared classes are
// byte-identical in all jars and only the entrypoint and the metadata file differ. Fabric reads
// fabric.mod.json and loads FabricEntry; NeoForge reads neoforge.mods.toml and finds @Mod on
// NeoForgeEntry by scanning bytecode; Paper reads paper-plugin.yml and loads PaperEntry. None of
// them ever loads another's entrypoint.
tasks.register('universalJar', Jar) {
	// Without the java plugin a Jar task lands in build/distributions.
	destinationDirectory = layout.buildDirectory.dir('libs')
	subprojects.each { sub ->
		dependsOn sub.tasks.named('jar')
		from(zipTree(sub.tasks.named('jar').flatMap { it.archiveFile }))
	}
	// Loom's manifest attributes describe the Fabric build only; this jar gets a plain one.
	exclude 'META-INF/MANIFEST.MF'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	// EXCLUDE keeps the first copy of a class and drops the rest without looking. That is only
	// right while every loader compiles the shared tree to the same bytes. A loader that patches a
	// vanilla signature — Paper did, with PlayerList#getPlayerStats — yields a class that links on
	// that loader only, and the jar would fail at runtime on the others, in that one code path.
	doFirst {
		def seen = [:]
		subprojects.each { sub ->
			zipTree(sub.tasks.named('jar').get().archiveFile).matching { include '**/*.class' }.visit { f ->
				if (f.directory) return
				def digest = f.file.bytes.digest('SHA-256')
				def first = seen.putIfAbsent(f.path, [sub.name, digest])
				if (first != null && first[1] != digest) {
					throw new GradleException("${f.path} differs between ${first[0]} and ${sub.name}: " +
							"the shared code calls something the loaders declare differently")
				}
			}
		}
	}
}
assemble.dependsOn universalJar
