pluginManagement {
	repositories {
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'deathcounter'

// One source tree, one project per loader. On this branch that is Forge 1.20.1 only.
include 'forge'
